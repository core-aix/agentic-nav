version: '3.8'


services:
  webinterface:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-agents-web
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      # Example environment variables (uncomment and modify as needed):
      # - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      # - DATABASE_URL=sqlite:///app/database/app.db
      # TODO: MAKE COMMANDLINE ARGS CONTROLLABLE VIA ENV VARIABLES
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j_db
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      # Authentication
      - NEO4J_AUTH=neo4j/llm_agents

      # Memory settings
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G

      # APOC plugin (optional but recommended)
      - NEO4J_PLUGINS=["apoc"]

      # Accept license (required for Enterprise features, remove if using Community)
      # - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p llm_agents 'RETURN 1'" ]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: