[project]
name = "llm-agents"
version = "0.1.0"
description = "A package containing versatile tooling for doing related work analysis on AI research."
readme = "README.md"
authors = [
    {name = "Shiqiang Wang", email = "s.wang9@exeter.ac.uk"},
    {name = "Herbert Woisetschläger", email = "herbert.woisetschlaeger@tum.de"}
]

requires-python = ">=3.14"
dependencies = [
    "aiofiles>=22.0,<25.0",
    "faiss-cpu>=1.12.0",
    "flask>=3.1.2",
    "gradio",
    "hatchling>=1.27.0",
    "httpx>=0.28.1",
    "kaleido>=1.1.0",
    "litellm",
    "matplotlib>=3.10.7",
    "neo4j>=6.0.3",
    "plotly>=6.3.1",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyvis>=0.3.2",
    "rich>=13.0.0",
    "sentence-transformers>=5.1.2",
    "toon-format",
    "typer>=0.20.0",
]

[tool.uv.workspace]
members = [
    "litellm",
    "gradio",
]

[tool.uv.sources]
litellm = { git = "https://github.com/shiqiangw/litellm.git" }
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
gradio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[tool.hatchling.build.targets.wheel]
packages = ["llm_agents"]

[project.scripts]
llm-agents-cli = "llm_agents.frontend.cli:main"
llm-agents-web = "llm_agents.frontend.browser_ui:main"
