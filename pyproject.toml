[project]
name = "llm-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.12.0",
    "flask>=3.1.2",
    "httpx>=0.28.1",
    "kaleido>=1.1.0",
    "litellm",
    "matplotlib>=3.10.7",
    "neo4j>=6.0.3",
    "plotly>=6.3.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "python-toon>=0.1.3",
    "pyvis>=0.3.2",
    "rich>=14.2.0",
    "sentence-transformers>=5.1.2",
    "typer>=0.20.0",
]

[tool.uv.workspace]
members = [
    "litellm",
]

[tool.uv.sources]
litellm = { git = "https://github.com/shiqiangw/litellm.git" }
