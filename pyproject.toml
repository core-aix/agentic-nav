[project]
name = "llm-agents"
version = "0.1.0"
description = "A package containing versatile tooling for doing related work analysis and planning conference visits in the AI research space."
readme = "README.md"
authors = [
    {name = "Shiqiang Wang", email = "s.wang9@exeter.ac.uk"},
    {name = "Herbert Woisetschläger", email = "herbert.woisetschlaeger@tum.de"}
]

requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "einops",
    "flask",
    "gradio[mcp,oauth]",
    "hatchling",
    "httpx",
    "kaleido",
    "litellm",
    "neo4j",
    "prompt-toolkit",
    "pydantic",
    "pydantic-settings",
    "pyvis>=0.3.2",
    "rich>=13.0.0",
    "sentence-transformers",
    "spaces",
    "toon-format",
    "typer",
]

[tool.uv.workspace]
members = [
    "litellm",
    # "gradio",
]

[tool.uv.sources]
litellm = { git = "https://github.com/shiqiangw/litellm.git" }
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
# gradio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[tool.hatchling.build.targets.wheel]
packages = ["llm_agents"]

[project.scripts]
agentic-nav-cli = "llm_agents.frontend.cli:main"
agentic-nav-web = "llm_agents.frontend.browser_ui:main"
